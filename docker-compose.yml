services:
  snapper:
    image: klattm/snapper:latest
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: ["server"]
    networks:
      - snapper-internal
    depends_on:
      snapper-egress:
        condition: service_healthy
  snapper-egress:
    image: klattm/snapper:latest
    env_file: .env
    expose:
      - "8081"
    user: "0:0"
    command: ["egress"]
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    volumes:
      - /lib/modules:/lib/modules:ro
    networks:
      - snapper-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
  postgres:
    image: postgres:16
    profiles:
      - dev
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: snapper
      POSTGRES_USER: snapper
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - snapper-internal
volumes:
  pgdata:
networks:
  snapper-internal:
    driver: bridge
    internal: false
