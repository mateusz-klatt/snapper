services:
  snapper:
    image: klattm/snapper:latest
    build:
      context: .
      target: runtime
    container_name: snapper
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: ["server"]
    networks:
      - snapper-internal
    depends_on:
      snapper-egress:
        condition: service_healthy
  snapper-egress:
    image: klattm/snapper:latest
    container_name: snapper-egress
    env_file: .env
    expose:
      - "8081"
    user: "0:0"
    command: ["egress"]
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    volumes:
      - ./data:/app/data
      - /lib/modules:/lib/modules:ro
    networks:
      - snapper-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
  snapper-web:
    image: klattm/snapper-web:latest
    build:
      context: .
      target: web-runtime
    container_name: snapper-web
    expose:
      - "8000"
    depends_on:
      snapper:
        condition: service_healthy
    networks:
      - snapper-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ | grep -q 'id=\"root\"' || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
  postgres:
    image: postgres:16
    profiles:
      - dev
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: snapper
      POSTGRES_USER: snapper
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - snapper-internal
volumes:
  pgdata:
networks:
  snapper-internal:
    driver: bridge
    internal: false
