services:
  snapper:
    image: klattm/snapper:latest
    build:
      context: .
      target: runtime
    container_name: snapper
    env_file: .env
    environment:
      - PROCESS_AUTOSTART_PROFILE=api
      - ZMQ_BROKER_XSUB=tcp://snapper:7500
      - ZMQ_BROKER_XPUB=tcp://snapper:7501
      - ZMQ_BROKER_BIND_XSUB=tcp://0.0.0.0:7500
      - ZMQ_BROKER_BIND_XPUB=tcp://0.0.0.0:7501
    expose:
      - "8000"
      - "7500"
      - "7501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: ["server"]
    networks:
      - snapper-internal
    restart: unless-stopped
    depends_on:
      snapper-egress:
        condition: service_healthy
  snapper-feed:
    image: klattm/snapper:latest
    container_name: snapper-feed
    env_file: .env
    environment:
      - PROCESS_AUTOSTART_PROFILE=feed
      - ZMQ_BROKER_XSUB=tcp://snapper:7500
      - ZMQ_BROKER_XPUB=tcp://snapper:7501
      - DB_POOL_SIZE=2
      - DB_MAX_OVERFLOW=3
    volumes:
      - ./data:/app/data
    command: ["feed-engine"]
    networks:
      - snapper-internal
    restart: unless-stopped
    depends_on:
      snapper:
        condition: service_healthy
      snapper-egress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import psutil,sys;sys.exit(0 if any(p.info['cmdline'] and 'snapper.server.process_runner' in p.info['cmdline'] for p in psutil.process_iter(['cmdline'])) else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  snapper-egress:
    image: klattm/snapper:latest
    container_name: snapper-egress
    env_file: .env
    expose:
      - "8081"
    user: "0:0"
    command: ["egress"]
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    volumes:
      - ./data:/app/data
      - /lib/modules:/lib/modules:ro
    networks:
      - snapper-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
  snapper-web:
    image: klattm/snapper:latest
    container_name: snapper-web
    entrypoint: ["/usr/bin/caddy"]
    command: ["run", "--config", "/etc/caddy/Caddyfile"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      snapper:
        condition: service_healthy
    networks:
      - snapper-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ | grep -q 'id=\"root\"' || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
  postgres:
    image: postgres:16
    profiles:
      - dev
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: snapper
      POSTGRES_USER: snapper
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - snapper-internal
    restart: unless-stopped
volumes:
  pgdata:
networks:
  snapper-internal:
    driver: bridge
    internal: false
