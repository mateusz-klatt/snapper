name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '25'

      - name: Install system dependencies
        run: make system-deps

      - name: Setup development environment
        run: make setup

      - name: UI setup
        run: make ui-setup

      - name: UI build
        run: make ui-build

      - name: Initialize database
        run: make migrate-dev

      - name: Check for type drift
        run: make ui-check-types

      - name: Run complete quality gate
        run: make check-all

      - name: Export Python coverage XML
        run: make cov-xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Docker build
        run: make docker-build-dev

      - name: Docker run
        run: |
          cp .env.example .env
          mkdir -p data
          make docker-run

      - name: Docker health check
        run: make server-check

      - name: Docker stop
        if: always()
        run: make docker-stop

  ios-test:
    runs-on: macos-15
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Setup Python environment
        run: make setup

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup iOS project
        run: make ios-setup

      - name: Build iOS app
        run: make ios-build

      - name: Run iOS tests
        run: make ios-test
