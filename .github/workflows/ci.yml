name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Init public submodules (frontend, snapper-mcp, ios)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init frontend integrations/snapper-mcp ios

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Install system dependencies
        run: make system-deps

      - name: Setup development environment
        run: make setup

      - name: UI setup
        run: make ui-setup

      - name: UI build
        run: make ui-build

      - name: Initialize database
        run: make migrate-dev

      - name: Check for type drift
        run: make ui-check-types

      - name: Run complete quality gate
        run: make check-all

      - name: Export Python coverage XML
        run: make cov-xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Docker build
        run: make docker-build-dev

      - name: Docker run
        run: |
          cp .env.example .env
          sed -i 's/^SERVER_API_ONLY=.*/SERVER_API_ONLY=true/' .env
          mkdir -p data
          make docker-migrate-dev
          docker compose up -d --no-deps --wait snapper snapper-web

      - name: Docker health check
        run: make server-check

      - name: Docker logs (on failure)
        if: failure()
        run: docker compose logs snapper snapper-web snapper-egress || true

      - name: Docker stop
        if: always()
        run: make docker-stop

  # iOS validation lives in the snapper-ios submodule's own CI.
  # See https://github.com/mateusz-klatt/snapper-ios/actions for build / test /
  # SonarCloud / gitleaks runs against the public repo.
