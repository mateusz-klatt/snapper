name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Init public submodules (frontend, snapper-mcp, ios)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init frontend integrations/snapper-mcp ios

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '25'

      - name: Install system dependencies
        run: make system-deps

      - name: Setup development environment
        run: make setup

      - name: UI setup
        run: make ui-setup

      - name: UI build
        run: make ui-build

      - name: Initialize database
        run: make migrate-dev

      - name: Check for type drift
        run: make ui-check-types

      - name: Run complete quality gate
        run: make check-all

      - name: Export Python coverage XML
        run: make cov-xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Docker build
        run: make docker-build-dev

      - name: Docker run
        run: |
          cp .env.example .env
          mkdir -p data
          make docker-run

      - name: Docker health check
        run: make server-check

      - name: Docker logs (on failure)
        if: failure()
        run: docker logs snapper || true

      - name: Docker stop
        if: always()
        run: make docker-stop

  # iOS validation lives in the snapper-ios submodule's own CI.
  # See https://github.com/mateusz-klatt/snapper-ios/actions for build / test /
  # SonarCloud / gitleaks runs against the public repo.
