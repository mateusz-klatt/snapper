name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Init public submodules (frontend, snapper-mcp, ios)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init frontend integrations/snapper-mcp ios

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '26'

      - name: Install system dependencies
        run: make system-deps

      - name: Setup development environment
        run: make setup

      - name: UI setup
        run: make ui-setup

      - name: UI build
        run: make ui-build

      - name: Initialize database
        run: make migrate-dev

      - name: Check for type drift
        run: make ui-check-types

      - name: Run complete quality gate
        run: make check-all

      - name: Export Python coverage XML
        run: make cov-xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Docker build
        run: make docker-build-dev

      - name: Docker run
        run: |
          cp .env.example .env
          sed -i 's/^SERVER_API_ONLY=.*/SERVER_API_ONLY=true/' .env
          mkdir -p data
          make docker-migrate-dev
          docker compose up -d --no-deps --wait snapper snapper-web

      - name: Docker health check
        run: make server-check

      - name: Docker logs (on failure)
        if: failure()
        run: docker compose logs snapper snapper-web snapper-egress || true

      - name: Docker stop
        if: always()
        run: make docker-stop

  # iOS validation lives in the snapper-ios submodule's own CI.
  # See https://github.com/mateusz-klatt/snapper-ios/actions for build / test /
  # SonarCloud / gitleaks runs against the public repo.
