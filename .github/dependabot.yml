
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    ignore:
      # ccxt 4.5.93 pins multidict==6.9.1; revisit the major when ccxt supports 7.x.
      - dependency-name: "multidict"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
