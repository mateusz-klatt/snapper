name: Snapper
options:
  bundleIdPrefix: ie.klatt
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "5.9"
  PRODUCT_NAME: Snapper
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  Snapper:
    type: application
    platform: iOS
    sources:
      - Snapper
    info:
      path: Snapper/Info.plist
      properties:
        CFBundleDisplayName: Snapper
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ie.klatt.snapper
      INFOPLIST_FILE: Snapper/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_MACCATALYST: false
      DEFINES_MODULE: YES
    scheme: {}
