name: Snapper
options:
  deploymentTarget:
    iOS: "26.2"
  xcodeVersion: "2620"

settings:
  SWIFT_VERSION: "6.0"
  PRODUCT_NAME: Snapper
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "9"
  DEVELOPMENT_TEAM: 26MP7QQP95
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  ENABLE_USER_SCRIPT_SANDBOXING: YES
  STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  Snapper:
    type: application
    platform: iOS
    sources:
      - Snapper
    info:
      path: Snapper/Info.plist
      properties:
        CFBundleDisplayName: Snapper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: SystemBackground
          UIImageName: AppIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.klatt.snapper
        INFOPLIST_FILE: Snapper/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        DEFINES_MODULE: YES
        ENABLE_MODULE_VERIFIER: YES
        MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu++14"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Snapper/Snapper.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Snapper/Snapper.Release.entitlements
    scheme: {}
