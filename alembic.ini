[alembic]
script_location = %(here)s/src/snapper/data/migrations
version_locations =
    %(here)s/src/snapper/data/migrations/versions
    %(here)s/proprietary/data/migrations/versions
prepend_sys_path = .
path_separator = newline
sqlalchemy.url = sqlite+aiosqlite:///./data/snapper.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
