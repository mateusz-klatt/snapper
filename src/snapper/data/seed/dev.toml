[profile]
name = "dev"
format_version = 2
tier = 3

[runtime_owned]
user_roles = ["ai_delegate", "ai_researcher"]

[[operators]]
label = "default"
description = "Default seed operator for single-user deployment"

[[users]]
username = "admin"
email = "admin@snapper.local"
password = "change-me-after-first-login"
role = "admin"
operators = ["default"]
primary_operator = "default"
readable_wallets = []

[[users]]
username = "operator"
email = "operator@snapper.local"
password = "change-me-after-first-login"
role = "operator"
operators = ["default"]
primary_operator = "default"
readable_wallets = []

[[users]]
username = "viewer"
email = "viewer@snapper.local"
password = "change-me-after-first-login"
role = "viewer"
operators = ["default"]
primary_operator = "default"
readable_wallets = []

[[settings]]
key = "ui_origin"
value = "http://localhost:3000,http://localhost:8000"
category = "server"
description = "Allowed UI origins for WebSocket CORS (comma-separated)"

[[settings]]
key = "market_persist_ticks"
value = '{"mode": "auto"}'
category = "market_persist"
description = "Tick persistence mode (auto = wallet-scope-derived, explicit = configured allowlist). MarketPersistPolicy"

[[settings]]
key = "market_persist_trades"
value = '{"mode": "auto"}'
category = "market_persist"
description = "Trade persistence mode (auto = wallet-scope-derived, explicit = configured allowlist). MarketPersistPolicy"

[[settings]]
key = "market_persist_candles"
value = '{"mode": "auto"}'
category = "market_persist"
description = "Candle persistence mode (auto = wallet-scope-derived, explicit = configured allowlist). MarketPersistPolicy"

[[settings]]
key = "market_persist_extra"
value = '{"ticks": {}, "trades": {}, "candles": {}}'
category = "market_persist"
description = "Per-data-type per-exchange overlay-INCLUDE allowlist applied on top of mode. MarketPersistPolicy"

[[settings]]
key = "market_persist_exclude"
value = '{"ticks": {}, "trades": {}, "candles": {}}'
category = "market_persist"
description = "Per-data-type per-exchange overlay-EXCLUDE blocklist subtracted from the resolved set. MarketPersistPolicy"

[[settings]]
key = "market_stats_pairs"
value = "[]"
category = "market_stats"
description = "Cross-exchange pairs for Pearson + cointegration computation (cap 50, configured at implementation time)"

[[settings]]
key = "live_trading_mode"
value = "halted"
category = "risk"
description = "Live-trading interlock: halted|reduce_only|enabled. Seeded halted; only enabled admits non-paper submits. Read fresh from DB on every non-paper submit; paper is exempt. Flipping to enabled is an explicit operator money-risk action."

[[settings]]
key = "risk_max_leverage"
value = "1.0"
category = "risk"
description = "Maximum prospective gross exposure as a multiple of equity, enforced by the portfolio risk gate (Phase 6). Placeholder until the gate ships."

[[settings]]
key = "risk_max_drawdown"
value = "0.15"
category = "risk"
description = "Maximum flow-adjusted drawdown fraction from the epoch peak before the portfolio risk gate blocks exposure increases (Phase 6). Placeholder until the gate ships."

[[settings]]
key = "risk_r_per_trade"
value = "0.005"
category = "risk"
description = "Fraction of equity risked per trade for risk-based position sizing. Placeholder until the sizing/gate path ships."

[[wallets]]
label = "paper"
is_paper = true
description = "Paper-mode wallet seeded for open-source dev deployment (10k USD bootstrap)"

[[wallets.credentials]]
exchange = "paper"
credential_type = "paper"
reconciliation_method = "unclassified"
initial_balance = "10000.0"
label = "paper bootstrap"

[[settings]]
key = "gemini_api_key"
value = ""
category = "api"
description = "Google Gemini API key (OpenAI-compat, generativelanguage.googleapis.com/v1beta/openai). Placeholder: real value lives in the environment seed, never this skeleton."

[[settings]]
key = "kimi_api_key"
value = ""
category = "api"
description = "Moonshot Kimi K3 API key (OpenAI-compat, api.moonshot.ai/v1). Placeholder: real value lives in the environment seed, never this skeleton."
