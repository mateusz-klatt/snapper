underlyings:

  - ticker: BTC
    name: Bitcoin
    asset_class: crypto
    patterns:
      - exchange: kraken
        match_type: exact
        pattern: "BTC-USD"
      - exchange: kraken
        match_type: exact
        pattern: "BTC-EUR"
      - exchange: zonda
        match_type: exact
        pattern: "BTC-USD"
      - exchange: zonda
        match_type: exact
        pattern: "BTC-EUR"
      - exchange: polygon
        match_type: exact
        pattern: "BTC-USD"
      - exchange: kraken_futures
        match_type: exact
        pattern: "BTC-USD-PERP"
        relationship_type: derivative
      - exchange: kraken_futures
        match_type: exact
        pattern: "BTC-USD-PERP-INV"
        relationship_type: derivative
      - exchange: kraken_futures
        match_type: regex
        pattern: '^BTC-USD-\d{6}$'
        relationship_type: derivative
        instrument_type: future
        contract_family: BTC
      - exchange: kraken_futures
        match_type: regex
        pattern: '^BTC-USD-\d{6}-INV$'
        relationship_type: derivative
        instrument_type: future
        contract_family: BTC-INV

