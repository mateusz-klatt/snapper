services:
  agent-console:
    profiles: ["agent-console"]
    image: snapper-agent-console
    build:
      context: ..
      dockerfile: snapper-agent-console/Dockerfile
    container_name: snapper-agent-console
    environment:
      AGENT_CONSOLE_MODE: idle
    volumes:
      - agent-console-home:/home/delegate
      - ${AGENT_CONSOLE_PAT_CONFIG:-./pat-config.json}:/run/secrets/snapper-mcp/config.json:ro
      - ${AGENT_CONSOLE_WORKSPACE:-./workspace}:/workspace
    working_dir: /workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  agent-console-home:
