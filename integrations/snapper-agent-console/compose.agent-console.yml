services:
  agent-console:
    profiles: ["agent-console"]
    image: snapper-agent-console
    build:
      context: ..
      dockerfile: snapper-agent-console/Dockerfile
    container_name: snapper-agent-console
    environment:
      AGENT_CONSOLE_MODE: ${AGENT_CONSOLE_MODE:-idle}
    volumes:
      - agent-console-home:/home/delegate
      - type: bind
        source: ${AGENT_CONSOLE_PAT_CONFIG:-./pat-config.json}
        target: /run/secrets/snapper-mcp/config.json
        read_only: true
        bind:
          create_host_path: false
      - ${AGENT_CONSOLE_WORKSPACE:-./workspace}:/workspace
    working_dir: /workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  agent-console-home:
