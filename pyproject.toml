[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "snapper"
version = "0.1.0"
description = "Kraken data collector, trading engine, and backtester"
readme = "README.md"
authors = ["Mateusz Klatt"]
license = "MIT"
keywords = ["trading", "kraken", "backtest", "rsi", "macd", "websocket"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
packages = [{include = "snapper", from = "src"}]

[tool.poetry.dependencies]
python = "^3.14"
aiohttp = "^3.14.3"
httpx = {extras = ["http2", "socks"], version = "^0.28.1"}
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.52"}
aiosqlite = "^0.22.1"
pandas = "^3.0.5"
numpy = "^2.5.2"
typer = {extras = ["all"], version = "^0.27.2"}
python-dotenv = "^1.2.3"
loguru = "^0.7.3"
alembic = "^1.19.2"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.52.4"}
pyzmq = "^27.2.0"
pyjwt = "^2.13.0"
TA-Lib = "^0.7.1"
ccxt = "^4.5.76"
python-kraken-sdk = "^3.3.0"
massive = "^2.8.0"
bcrypt = "^5.0.0"
slowapi = "^0.1.10"
PyYAML = ">=6.0.3"
mcp = "^2.1.1"
aioapns = "^4.0"
psutil = "^7.2.2"
statsmodels = "^0.15.0"
python-socks = {extras = ["asyncio"], version = "^3.0.0"}
PySocks = "^1.7.1"
pyroute2 = "^0.9.6"
websockets = "^17.1"

[tool.poetry.group.cloud.dependencies]
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.12"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.5"
black = {extras = ["jupyter"], version = "^26.5.1"}
isort = "^9.0.1"
mypy = "^2.3.1"
types-PyYAML = ">=6.0.12.20260815"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-timeout = "^2.4.0"
freezegun = "^1.5.5"
pytest-cov = "^7.1.0"
pre-commit = "^4.6.2"
pip = "^26.2.1"
poetry = "^2.4.2"
poetry-plugin-up = "^0.9.0"
poetry-plugin-dotenv = "^3.3.2"
py-spy = "^0.4.2"
memory-profiler = "^0.61.0"
ipdb = "^0.13.13"
objgraph = "^3.6.2"
pytest-xdist = "^3.8.0"
markdown = "^3.10.3"
weasyprint = "^69.0"
plotly = "^7.0.0"
kaleido = "^1.3.0"
nbformat = "^5.11.1"
ipykernel = "^7.3.0"
matplotlib = "^3.11.1"
scikit-learn = "^1.9.0"
tqdm = "^4.70.0"
types-markdown = "^3.10.2.20260712"
httpx2 = "^2.12.0"

[tool.poetry.scripts]
snapper = "snapper.__main__:main"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "data/polygon",
    "frontend/node_modules",
    "frontend/dist",
    "ios",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "C4",
    "SIM",
    "N",
    "PERF",
    "ISC",
    "PLW",
    "PLC",
    "A",
    "TID",
    "PT001",
    "PT023",
    "D",
    "C901",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]
ignore = [
    "B008",     # Function call in default argument
    "PERF203",  # try-except in loop
    "E501",     # Line too long (handled by black)
    "SIM102",   # Collapsible if
    "PLC0415",  # Import outside top-level
    "C408",     # Unnecessary dict call
    "PLW1509",  # preexec_fn is unsafe with threads (intentional for process groups)
    "PERF401",  # Use list comprehension (not possible with async for)
    "PLC2801",  # Dunder calls (__str__, __eq__) - needed for explicit protocol testing
    "PLC2701",  # Private member access - needed in tests
    "PLW0108",  # Lambda may be unnecessary - often clearer than partial
    "B903",     # Class could be dataclass - not always desired
    "PLC1901",  # empty string comparison - explicit == "" is clearer in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Tests: allow private access, getattr literals
"tests/**/*.py" = [
    "B009",     # getattr with literal
    "B901",     # return/yield in generator
    "N802",     # Function name not lowercase (e.g., getMessage)
]
"proprietary/tests/**/*.py" = [
    "B009",     # getattr with literal
    "B901",     # return/yield in generator
    "N802",     # Function name not lowercase
]
"integrations/snapper-delegate/tests/**/*.py" = [
    "B009",
    "B901",
    "N802",
]
# External API field name 'l' (low price) - ambiguous but required by Zonda API
"src/snapper/infrastructure/exchanges/schemas/zonda.py" = ["E741"]
# Must mock weasyprint before importing - requires imports after sys.modules manipulation
"tests/scripts/test_build_docs_pdf.py" = ["E402"]
"src/snapper/infrastructure/exchanges/kraken_sdk_patches.py" = ["B009", "B010"]

[tool.ruff.lint.extend-per-file-ignores]
