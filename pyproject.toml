[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["proprietary", "snapper", "snapper_delegate"]
known-third-party = ["alembic", "sqlalchemy"]
force-single-line = true

[tool.black]
line-length = 100
extend-exclude = '''
/(
    # Virtual environment
    \.venv
  # Submodules
  | data/polygon
  # Node modules
  | frontend/node_modules
  | frontend/dist
  # iOS
  | ios
  # Build artifacts
  | build
  | dist
  | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["proprietary", "snapper", "snapper_delegate"]
known_third_party = ["alembic", "sqlalchemy"]
force_single_line = true
skip = [".venv", "build", "dist", "data/polygon", "frontend", "ios", "notebooks"]
skip_glob = ["**/node_modules/*"]

[tool.pytest.ini_options]
addopts = "-q --tb=short --timeout=15 -m 'not integration'"
asyncio_mode = "auto"
timeout = 15
testpaths = ["tests", "proprietary/tests", "integrations/snapper-delegate/tests"]
pythonpath = ["src", "proprietary/src", "integrations/snapper-delegate/src"]
markers = [
    "real_settings: mark test to use real Settings instead of mocked version",
    "integration: real-broker integration test (excluded from default test run; opt in via make test-integration)",
    "capability_guard: opt out of the tests/server bypass_capability_guard fixture so the real require_tradable runs",
]

[tool.mypy]
python_version = "3.14"
platform = "linux"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
pretty = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
check_untyped_defs = true
exclude = [
    '^\.venv/',
    '^data/polygon/',
    '^frontend/',
    '^ios/',
    '^build/',
    '^dist/',
]

[[tool.mypy.overrides]]
module = ["tests.*"]
# Tests can mock methods and pass invalid types intentionally
disable_error_code = [
    "method-assign",
    "arg-type",
    "assignment",
    "attr-defined",
    "type-arg",
    "comparison-overlap",
    "override",
    "no-untyped-call",
    "misc",
    "return-value",
]

[tool.pyright]
include = [
    "src",
    "tests",
    "proprietary/src",
    "proprietary/tests",
    "integrations/snapper-delegate/src",
    "integrations/snapper-delegate/tests",
]
exclude = ["**/__pycache__", "build", "dist", ".venv", "data", "frontend", "ios"]
reportPrivateUsage = false  # Tests need to access private members
reportUnknownVariableType = false  # Dynamic typing from external libraries
reportUnknownArgumentType = false  # Dynamic typing from external libraries
reportUnknownMemberType = false  # Dynamic typing from external libraries

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = [
    "src/snapper",
    "proprietary/src",
    "integrations/snapper-delegate/src/snapper_delegate",
    "scripts",
]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
fail_under = 100
exclude_lines = [
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.\\s*$",
]
