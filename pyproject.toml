[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "snapper"
version = "0.1.0"
description = "Kraken data collector, trading engine, and backtester"
readme = "README.md"
authors = ["Mateusz Klatt"]
license = "MIT"
keywords = ["trading", "kraken", "backtest", "rsi", "macd", "websocket"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
packages = [{include = "snapper", from = "src"}]

[tool.poetry.dependencies]
python = "^3.14"
aiohttp = "^3.14.1"
httpx = {extras = ["http2", "socks"], version = "^0.28.1"}
pydantic = "^2.13.4"
pydantic-settings = "^2.14.2"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.51"}
aiosqlite = "^0.22.1"
pandas = "^3.0.3"
numpy = "^2.5.1"
typer = {extras = ["all"], version = "^0.27.0"}
python-dotenv = "^1.2.2"
loguru = "^0.7.3"
alembic = "^1.18.5"
fastapi = "^0.139.2"
uvicorn = {extras = ["standard"], version = "^0.51.0"}
pyzmq = "^27.1.0"
pyjwt = "^2.13.0"
TA-Lib = "^0.7.1"
ccxt = "^4.5.66"
python-kraken-sdk = "^3.3.0"
massive = "^2.8.0"
bcrypt = "^5.0.0"
slowapi = "^0.1.10"
PyYAML = ">=6.0.3"
mcp = ">=1.28.1"
aioapns = "^4.0"
psutil = "^7.2.2"
statsmodels = "^0.14.6"
python-socks = {extras = ["asyncio"], version = "^2.8.2"}
PySocks = "^1.7.1"
pyroute2 = "^0.9.6"

[tool.poetry.group.cloud.dependencies]
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.12"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.22"
black = {extras = ["jupyter"], version = "^26.5.1"}
isort = "^8.0.1"
mypy = "^2.3.0"
types-PyYAML = ">=6.0.12.20260518"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-timeout = "^2.4.0"
freezegun = "^1.5.5"
pytest-cov = "^7.1.0"
pre-commit = "^4.6.0"
pip = "^26.1.2"
poetry = "^2.4.1"
poetry-plugin-up = "^0.9.0"
poetry-plugin-dotenv = "^3.3.2"
py-spy = "^0.4.2"
memory-profiler = "^0.61.0"
ipdb = "^0.13.13"
objgraph = "^3.6.2"
pytest-xdist = "^3.8.0"
markdown = "^3.10.2"
weasyprint = "^69.0"
plotly = "^6.9.0"
kaleido = "^1.3.0"
nbformat = "^5.10.4"
ipykernel = "^7.3.0"
matplotlib = "^3.11.1"
scikit-learn = "^1.9.0"
tqdm = "^4.69.0"
types-markdown = "^3.10.2.20260712"
httpx2 = "^2.7.0"

[tool.poetry.scripts]
snapper = "snapper.__main__:main"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "data/polygon",
    "frontend/node_modules",
    "frontend/dist",
    "ios",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "N", "PERF", "ISC", "PLW", "PLC", "A", "TID", "D"]
ignore = [
    "B008",     # Function call in default argument
    "PERF203",  # try-except in loop
    "E501",     # Line too long (handled by black)
    "SIM102",   # Collapsible if
    "PLC0415",  # Import outside top-level
    "C408",     # Unnecessary dict call
    "PLW1509",  # preexec_fn is unsafe with threads (intentional for process groups)
    "PERF401",  # Use list comprehension (not possible with async for)
    "PLC2801",  # Dunder calls (__str__, __eq__) - needed for explicit protocol testing
    "PLC2701",  # Private member access - needed in tests
    "PLW0108",  # Lambda may be unnecessary - often clearer than partial
    "B903",     # Class could be dataclass - not always desired
    "PLC1901",  # empty string comparison - explicit == "" is clearer in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: allow private access, getattr literals
"tests/**/*.py" = [
    "B009",     # getattr with literal
    "B901",     # return/yield in generator
    "N802",     # Function name not lowercase (e.g., getMessage)
]
"proprietary/tests/**/*.py" = [
    "B009",     # getattr with literal
    "B901",     # return/yield in generator
    "N802",     # Function name not lowercase
]
# External API field name 'l' (low price) - ambiguous but required by Zonda API
"src/snapper/infrastructure/exchanges/schemas/zonda.py" = ["E741"]
# Must mock weasyprint before importing - requires imports after sys.modules manipulation
"tests/scripts/test_build_docs_pdf.py" = ["E402"]
"src/snapper/infrastructure/exchanges/kraken_sdk_patches.py" = ["B009", "B010"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["snapper"]
known-third-party = ["alembic", "sqlalchemy"]
force-single-line = true

[tool.black]
line-length = 100
extend-exclude = '''
/(
    # Virtual environment
    \.venv
  # Submodules
  | data/polygon
  # Node modules
  | frontend/node_modules
  | frontend/dist
  # iOS
  | ios
  # Build artifacts
  | build
  | dist
  | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["snapper"]
known_third_party = ["alembic", "sqlalchemy"]
force_single_line = true
skip = [".venv", "build", "dist", "data/polygon", "frontend", "ios", "notebooks"]
skip_glob = ["**/node_modules/*"]

[tool.pytest.ini_options]
addopts = "-q --tb=short --timeout=15 --timeout-method=thread -m 'not integration'"
asyncio_mode = "auto"
timeout = 15
testpaths = ["tests", "proprietary/tests"]
pythonpath = ["src", "proprietary/src"]
markers = [
    "real_settings: mark test to use real Settings instead of mocked version",
    "integration: real-broker integration test (excluded from default test run; opt in via make test-integration)",
    "capability_guard: opt out of the tests/server bypass_capability_guard fixture so the real require_tradable runs",
]

[tool.mypy]
python_version = "3.14"
platform = "linux"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
pretty = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
check_untyped_defs = true
exclude = [
    '^\.venv/',
    '^data/polygon/',
    '^frontend/',
    '^ios/',
    '^build/',
    '^dist/',
]

[[tool.mypy.overrides]]
module = ["tests.*"]
# Tests can mock methods and pass invalid types intentionally
disable_error_code = [
    "method-assign",
    "arg-type",
    "assignment",
    "attr-defined",
    "type-arg",
    "comparison-overlap",
    "override",
    "no-untyped-call",
    "misc",
    "return-value",
]

[tool.pyright]
include = ["src", "tests", "proprietary/src", "proprietary/tests"]
exclude = ["**/__pycache__", "build", "dist", ".venv", "data", "frontend", "ios"]
reportPrivateUsage = false  # Tests need to access private members
reportUnknownVariableType = false  # Dynamic typing from external libraries
reportUnknownArgumentType = false  # Dynamic typing from external libraries
reportUnknownMemberType = false  # Dynamic typing from external libraries

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["src/snapper", "proprietary/src", "scripts"]
branch = true
omit = [
    # `__init__.py` files are forced empty by project rule (CLAUDE.md);
    # coverage of 0/0 is meaningless AND the same basename exists in all
    # three `source` roots so SonarCloud's lcov->basename collapse
    # produces "ambiguity, the file exists in several 'source'" warnings.
    "*/__init__.py",
    "src/snapper/data/migrations/*",
]

[tool.coverage.report]
skip_covered = true
show_missing = true
fail_under = 100
exclude_lines = [
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.\\s*$",
]
