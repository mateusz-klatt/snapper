sonar.projectKey=mateusz-klatt_snapper
sonar.organization=mateusz-klatt


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=snapper
#sonar.projectVersion=1.0


# Analyze every checked-out backend file. Test inclusions below classify tests
# without narrowing the source surface.
sonar.sources=.
sonar.tests=.

# Python coverage (XML generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Test classification: the complete backend and delegate test trees are test
# code, including conftest.py fixtures, dummy processes and helpers.
sonar.test.inclusions=tests/**,integrations/snapper-delegate/tests/**

# Public OSS submodules have independent SonarCloud projects and are excluded
# here to avoid duplicate analysis and duplicate LOC accounting.
sonar.exclusions=frontend/**,integrations/snapper-mcp/**,ios/**

# Exact Python version for precise analysis
sonar.python.version=3.14

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
