sonar.projectKey=mateusz-klatt_snapper
sonar.organization=mateusz-klatt


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=snapper
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Python coverage (XML generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Test classification: the whole tests/ tree is test code, including
# conftest.py fixtures, dummy processes and helpers — the previous
# **/test_*.py glob left ~700 ncloc of test infrastructure counted as
# MAIN code against the 100k LOC plan limit.
sonar.test.inclusions=tests/**

# Exclude machine-generated code + immutable artifacts + dev tooling + the
# public OSS submodules (each analyzed by its own SonarCloud project:
# mateusz-klatt_snapper-frontend, mateusz-klatt_snapper-ios). Alembic
# migration files (immutable schema deltas), and scripts/** (dev tooling —
# already covered by make check-all linters; not in the production runtime
# path).
#
# LOC-budget exclusions (2026-06-11, ncloc hit 100 068 of the 100 000 plan
# limit and analysis stopped):
# - **/*.yaml + **/*.yml: data/config, not reviewed code. The single
#   biggest offender was src/snapper/data/underlying_mappings.yaml — a
#   15 231-line static symbol-mapping DATA file (15% of the entire
#   budget). Also drops docker-compose.yml and workflow YAML (the
#   compose file has its own lint in make check-all).
# - src/snapper/i18n/catalogs/**: translation catalog JSON for 45
#   locales — UI copy data, not code.
# - integrations/**: the public snapper-mcp OSS submodule (TypeScript,
#   ~15k lines incl. package JSON) is checked out by the CI scan job but
#   belongs to its own SonarCloud project — it was silently billed
#   against this project's 100k plan limit.
# - migrations/** widened from versions/** to also drop env.py/tooling.
#
# LOC-budget additions (2026-07-12, ncloc crossed 100k again — ~101.1k after
# P&L Phase 2 growth in application/; SonarCloud rejected the over-limit
# analysis and froze the dashboard at the last good 99,549 scan):
# - src/snapper/cli/**: operational CLI tooling (parallel to the already-
#   excluded scripts/**) — still covered by mypy + make check-all.
# - src/snapper/data/repository_types.py: TypedDict row/DTO declarations —
#   no maintainability/complexity signal for Sonar; still type-checked by mypy.
#
# LOC-budget additions (2026-07-14, ncloc approached 100k again after PnL
# Phase 4 grew src/snapper/data/repository.py by ~984 lines):
# - Pydantic DTO declaration dirs api/schemas/**, messaging/schemas/** and
#   infrastructure/exchanges/schemas/**: request/response + wire-format DTOs.
#   Same rationale as repository_types.py — no maintainability/complexity
#   signal for Sonar; still type-checked by mypy and covered by
#   check-pydantic-routes.
sonar.exclusions=frontend/**,ios/**,integrations/**,src/snapper/data/migrations/**,scripts/**,**/*.yaml,**/*.yml,src/snapper/i18n/catalogs/**,src/snapper/cli/**,src/snapper/data/repository_types.py,src/snapper/api/schemas/**,src/snapper/messaging/schemas/**,src/snapper/infrastructure/exchanges/schemas/**

# Belt-and-suspenders: keep generated files out of duplicate detection even if
# sonar.exclusions somehow wouldn't apply.
sonar.cpd.exclusions=frontend/**,ios/**,integrations/**,src/snapper/data/migrations/**,scripts/**,**/*.yaml,**/*.yml,src/snapper/i18n/catalogs/**,src/snapper/cli/**,src/snapper/data/repository_types.py,src/snapper/api/schemas/**,src/snapper/messaging/schemas/**,src/snapper/infrastructure/exchanges/schemas/**

# Exclude iOS from coverage metric (the iOS submodule has its own SonarCloud
# project that handles coverage). Defensive duplicate of the line above.
sonar.coverage.exclusions=ios/**

# Exact Python version for precise analysis
sonar.python.version=3.12

# Disable PL/SQL analysis (not used in this project)
sonar.plsql.file.suffixes=nonexistent

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# ----------------------------------------------------------------------
# Rule suppressions — intentional design decisions, lifted into config
# so they survive line-number drift across releases (vs. one-by-one
# "Safe" marks in the SonarCloud UI which are tied to specific line
# fingerprints and re-fire on any neighborhood edit).
#
# - python:S5332 (insecure HTTP) on websocket/helpers.py: the
#   `validate_origin` allowed-origins set intentionally includes BOTH
#   `https://{session_domain}` AND `http://{session_domain}` so that
#   local-dev WebSocket connections (where TLS is not configured) pass
#   the same origin guard as production HTTPS. The HTTPS variant is
#   added unconditionally; the HTTP variant is the documented dev-mode
#   relaxation.
#
# - python:S3330 (cookie missing HttpOnly) on auth/routes.py: the three
#   flagged sites all set the `csrf_token` cookie (login post at line
#   228, refresh-token post at line 436, logout-clear at line 674).
#   CSRF tokens in a double-submit cookie pattern MUST be readable by
#   JavaScript so the SPA can include them in the `X-CSRF-Token` header
#   on mutating requests; setting `httponly=True` on the CSRF cookie
#   would break the entire CSRF protection by hiding the token from
#   the browser-side client. The sibling `access_token` and
#   `refresh_token` cookies in the same `set_cookie` calls correctly
#   stay `httponly=True`.
sonar.issue.ignore.multicriteria=pythonDevHttpAllowedOrigin,pythonCsrfCookieNotHttpOnly
sonar.issue.ignore.multicriteria.pythonDevHttpAllowedOrigin.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.pythonDevHttpAllowedOrigin.resourceKey=src/snapper/interface/websocket/helpers.py
sonar.issue.ignore.multicriteria.pythonCsrfCookieNotHttpOnly.ruleKey=python:S3330
sonar.issue.ignore.multicriteria.pythonCsrfCookieNotHttpOnly.resourceKey=src/snapper/auth/routes.py
