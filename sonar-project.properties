sonar.projectKey=mateusz-klatt_snapper
sonar.organization=mateusz-klatt


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=snapper
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Python coverage (XML generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# TypeScript/JavaScript coverage (LCOV generated by vitest)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Test file patterns (so SonarCloud classifies them correctly)
sonar.test.inclusions=**/test_*.py,**/*.test.ts,**/*.test.tsx,**/SnapperTests/**

# Exclude machine-generated code from analysis.
# - **/*.generated.* : auto-generated TS + zod files from backend OpenAPI
# - ios/Snapper/Models/Generated/** : Swift types generated from Python models
# - src/snapper/data/migrations/versions/** : immutable Alembic migration artifacts
sonar.exclusions=**/*.generated.*, **/*.generated.zod.ts, ios/Snapper/Models/Generated/**, src/snapper/data/migrations/versions/**

# Exclude iOS from coverage metric (we don't run iOS tests in CI yet).
# Quality analysis (issues, bugs, smells) still applies to hand-written Swift.
sonar.coverage.exclusions=ios/**

# Exact Python version for precise analysis
sonar.python.version=3.12

# Disable PL/SQL analysis (not used in this project)
sonar.plsql.file.suffixes=nonexistent

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
